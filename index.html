<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#04214a" />
  <meta name="description" content="A master timer that sequences every dish so your whole meal is ready at once." />
  <title>Cook With Me</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="brand-icon">🍳</span> <h1>Cook With Me</h1></div>
    <div class="header-actions">
      <button id="choose-top" class="icon-btn" aria-label="Choose dishes">🍽️</button>
      <button id="reset-top" class="icon-btn" aria-label="Reset meal">🔄</button>
    </div>
  </header>

  <main>
    <!-- Hero: overall meal status + next step -->
    <section class="card hero" id="hero"></section>

    <!-- Gantt: every dish as a lane, colored step blocks, a "now" line -->
    <section class="card gantt-card" id="gantt"></section>
  </main>

  <footer class="app-footer">
    <span class="version" id="version">V—</span>
  </footer>

  <!-- Dish picker modal (launches at startup) -->
  <div id="picker" class="editor-overlay" hidden>
    <div class="editor-panel">
      <div class="editor-head">
        <h2>Choose dishes</h2>
        <button id="picker-close" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <p class="picker-hint">Pick what you're cooking. They'll be sequenced to finish together.</p>
      <div id="picker-list" class="picker-list"></div>
      <div class="editor-actions">
        <button id="picker-done" class="btn primary full">Done</button>
      </div>
    </div>
  </div>

  <script src="version.js"></script>
  <script src="app.js"></script>
</body>
</html>
