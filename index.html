<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b2540" />
  <meta name="description" content="A master timer that sequences every dish so your whole meal is ready at once." />
  <title>Cook With Me</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="brand-icon">🍳</span> <h1>Cook With Me</h1></div>
    <button id="edit-btn" class="icon-btn" aria-label="Edit meal">⚙️</button>
  </header>

  <main>
    <!-- Hero: overall meal status + next step -->
    <section class="card hero" id="hero"></section>

    <!-- Stacked dish cards -->
    <section id="dishes" class="dishes"></section>
  </main>

  <footer class="app-footer">
    <p id="footer-meta">Tap Start to sequence every dish to finish together.</p>
    <button id="reset-example" class="link-btn">Load example meal</button>
    <p class="version" id="version">V—</p>
  </footer>

  <!-- Editor modal -->
  <div id="editor" class="editor-overlay" hidden>
    <div class="editor-panel">
      <div class="editor-head">
        <h2>Edit meal</h2>
        <button id="editor-close" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <div id="editor-dishes" class="editor-dishes"></div>
      <button id="add-dish" class="btn ghost full">+ Add dish</button>
      <div class="editor-actions">
        <button id="editor-cancel" class="btn ghost">Cancel</button>
        <button id="editor-save" class="btn primary">Save meal</button>
      </div>
    </div>
  </div>

  <script src="version.js"></script>
  <script src="app.js"></script>
</body>
</html>
